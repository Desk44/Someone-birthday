<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website terkunci!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b0c10;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #ffffff;
    }
    
    .card {
      background: #12131c;
      width: 100%;
      max-width: 380px;
      padding: 35px 25px;
      border-radius: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .lock-icon {
      width: 42px;
      height: 42px;
      margin: 0 auto 15px auto;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lock-icon svg {
      width: 20px;
      height: 20px;
      fill: #a0a5ba;
    }

    h2 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #ffffff;
    }

    p.subtitle {
      font-size: 13px;
      color: #7b8192;
      margin-bottom: 25px;
    }
    
    .dots-container {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 35px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #232635;
      transition: all 0.2s ease;
    }

    .dot.active {
      background-color: #e91e63;
      box-shadow: 0 0 10px #e91e63;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      justify-items: center;
      margin-bottom: 30px;
    }

    .key {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: #1a1c28;
      color: #e0e6ed;
      font-size: 20px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
      border: 1px solid transparent;
    }

    .key:hover {
      background: #232637;
    }

    .key:active, .key.pressed {
      background: rgba(233, 30, 99, 0.2);
      border-color: #e91e63;
      color: #ffffff;
      box-shadow: 0 0 15px rgba(233, 30, 99, 0.4);
      transform: scale(0.95);
    }

    .key.action-btn {
      font-size: 16px;
      color: #7b8192;
    }

    .clue-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(233, 30, 99, 0.1);
      border: 1px solid rgba(233, 30, 99, 0.25);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      color: #e91e63;
    }

    .clue-badge svg {
      width: 14px;
      height: 14px;
      fill: #e91e63;
    }
  </style>
</head>
<body>
  
<audio id="clickSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>

  <div class="card">
    <div class="lock-icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 17a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6-6h-1V9a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2zm-6-8a3 3 0 0 1 3 3v2H9V6a3 3 0 0 1 3-3z"/>
      </svg>
    </div>

    <h2>Website Terkunci</h2>
    <p class="subtitle">Masukan kode untuk membuka website!</p>

    <div class="dots-container" id="dotsContainer">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    
    <div class="keypad">
      <div class="key" onclick="pressKey('1')">1</div>
      <div class="key" onclick="pressKey('2')">2</div>
      <div class="key" onclick="pressKey('3')">3</div>
      <div class="key" onclick="pressKey('4')">4</div>
      <div class="key" onclick="pressKey('5')">5</div>
      <div class="key" onclick="pressKey('6')">6</div>
      <div class="key" onclick="pressKey('7')">7</div>
      <div class="key" onclick="pressKey('8')">8</div>
      <div class="key" onclick="pressKey('9')">9</div>
      <div class="key action-btn" onclick="clearAll()">C</div>
      <div class="key" onclick="pressKey('0')">0</div>
      <div class="key action-btn" onclick="backspace()">⌫</div>
    </div>

    <div class="clue-badge">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
      </svg>
      <span>Website dapat diakses setelah kode benar</span>
    </div>
  </div>

  <script>
    const SECRET_CODE = "110510"; 
    
    let inputCode = "";
    const dots = document.querySelectorAll('.dot');

    function updateDots() {
      dots.forEach((dot, index) => {
        if (index < inputCode.length) {
          dot.classList.add('active');
        } else {
          dot.classList.remove('active');
        }
      });
    }

    function pressKey(num) {
  if (inputCode.length < 6) {
    inputCode += num;
    document.getElementById('clickSound').currentTime = 0;
    document.getElementById('clickSound').play(); 
    updateDots();
    
    if (inputCode.length === 6) {
      setTimeout(checkCode, 200);
    }
  }
}


    function backspace() {
      if (inputCode.length > 0) {
        inputCode = inputCode.slice(0, -1);
        updateDots();
      }
    }

    function clearAll() {
      inputCode = "";
      updateDots();
    }

    function checkCode() {
      if (inputCode === SECRET_CODE) {
        window.location.href = "Photo.html";
      } else {
        alert("❌ Kode Salah! Coba lagi.");
        clearAll();
      }
    }
  </script>
</body>
</html>
